<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>以前のPython実行デモ | Neural Daylight</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="site-top"><div class="site-top-inner"><a class="logo" href="./"><span class="logo-mark">◈</span><span>Neural <em>Daylight</em></span></a><a class="btn compact soft" href="./">新しい教材へ →</a></div></header><main class="container" style="max-width:950px"><div class="eyebrow">ARCHIVED PROTOTYPE</div><h1 style="margin:12px 0 18px">Python実行デモ</h1><p class="muted">以前の技術検証の体験を残したページです。Pyodideを読み込み、ブラウザ内でPythonを実行できます。元のデモで使ったIndexedDB名とストアを引き継ぎます。</p><section class="card" style="padding:24px;margin-top:22px"><label class="label" for="python-code">Pythonコード</label><textarea class="field" id="python-code" style="min-height:150px;font-family:monospace">sales = [120, 150, 90, 140, 100]
print(sum(sales) / len(sales))</textarea><div style="display:flex;gap:9px;flex-wrap:wrap;margin:15px 0"><button class="btn primary" id="run">Pythonを実行</button><button class="btn" id="record">学習済みにする</button><button class="btn" id="history">履歴をJSONで出力</button></div><div class="tiny" id="status">初回実行時はPyodideをインターネットから読み込みます。</div><div class="code-card"><div class="code-bar">OUTPUT</div><pre id="output" style="white-space:pre-wrap">実行結果がここに表示されます。</pre></div></section><p class="tiny">信頼できるコードだけを実行してください。ブラウザ内Pythonの完全なサンドボックスは保証しません。</p></main><script>
let db,python;
const get=id=>document.getElementById(id);
const openDB=()=>new Promise((resolve,reject)=>{const r=indexedDB.open('ai-learning-portfolio',1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('state'))d.createObjectStore('state',{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const add=async(type,detail)=>{try{db??=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction('events','readwrite');const q=tx.objectStore('events').add({type,detail,at:new Date().toISOString()});q.onsuccess=resolve;q.onerror=()=>reject(q.error)});}catch(e){get('status').textContent='履歴保存に失敗: '+e.message}};
get('record').onclick=async()=>{await add('lesson',{lessonId:'lesson01'});get('status').textContent='学習履歴を記録しました。'};
get('run').onclick=async()=>{const btn=get('run');btn.disabled=true;get('status').textContent='Pythonを準備しています…';let output='';try{if(!window.loadPyodide){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js';await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.append(s)})}python??=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/'});python.globals.set('user_code',get('python-code').value);await python.runPythonAsync('import io, contextlib, traceback\n__o=io.StringIO()\ntry:\n with contextlib.redirect_stdout(__o),contextlib.redirect_stderr(__o):\n  exec(compile(user_code,"<lesson>","exec"),{})\nexcept BaseException:\n traceback.print_exc(file=__o)\n__result=__o.getvalue()');output=python.globals.get('__result')||'（出力なし）';get('status').textContent='Pythonを実行しました。';}catch(e){output=e.message;get('status').textContent='実行できませんでした。'}get('output').textContent=output;await add('python',{code:get('python-code').value,output,ok:!output.includes('Traceback')});btn.disabled=false;};
get('history').onclick=async()=>{try{db??=await openDB();const events=await new Promise((resolve,reject)=>{const q=db.transaction('events','readonly').objectStore('events').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),events},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='python-demo-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){get('status').textContent='履歴出力に失敗しました: '+e.message}};
</script></body></html>
